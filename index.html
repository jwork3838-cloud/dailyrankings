<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insider's Edge | Daily HR Predictions</title>
    
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS for the interactive table -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; padding-top: 2rem; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .ev-yes { background-color: #d1e7dd !important; color: #0f5132; font-weight: bold; }
        th { background-color: #212529 !important; color: white !important; }
    </style>
</head>
<body>

<div class="container-fluid px-4">
    <div class="text-center mb-4">
        <h1 class="display-5 fw-bold">⚾ Daily HR Predictions & +EV Bets</h1>
        <p class="text-muted">Automatically updated daily at 9:00 AM EST</p>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table id="predictionsTable" class="table table-striped table-hover align-middle" style="width:100%">
                <!-- Table headers will be generated automatically -->
            </table>
        </div>
    </div>
</div>

<!-- jQuery, PapaParse (for CSV reading), and DataTables JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
    // 🚨 PASTE YOUR GOOGLE SHEETS CSV LINK HERE 🚨
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbOWh-Zz4jhsg5zayDcOskNgPKzO8cA_S9fzxHKrdRHKpZa6BpQuhFAjb8zHWmWgtcYmT8wtgxb2fD/pub?gid=435710657&single=true&output=csv";

    $(document).ready(function() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                
                // Extract column headers from the CSV
                const columns = Object.keys(data[0]).map(key => ({ 
                    title: key, 
                    data: key 
                }));

                // Initialize the interactive table
                $('#predictionsTable').DataTable({
                    data: data,
                    columns: columns,
                    order: [[0, 'asc']], // Sort by the first column (Rank) by default
                    pageLength: 25,
                    createdRow: function(row, data, dataIndex) {
                        // Highlight the row green if Plus_EV is "YES"
                        if (data['Plus_EV'] === 'YES') {
                            $(row).addClass('ev-yes');
                        }
                    }
                });
            }
        });
    });
</script>

</body>
</html>
